name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm validate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install -g phio tsx
      - name: Restore phio deploy key
        # phio authenticates deploys with a persistent ed25519 keypair that
        # must match the account key at pockethost.io/account/keys; fresh
        # runners would otherwise generate a new, mismatched key every run.
        run: |
          mkdir -p ~/.config/phio-nodejs
          printf '%s' "$PHIO_DEPLOY_KEY" | base64 -d > ~/.config/phio-nodejs/phio_deploy_ed25519
          printf '%s' "$PHIO_DEPLOY_KEY_PUB" | base64 -d > ~/.config/phio-nodejs/phio_deploy_ed25519.pub
          chmod 600 ~/.config/phio-nodejs/phio_deploy_ed25519
        env:
          PHIO_DEPLOY_KEY: ${{ secrets.PHIO_DEPLOY_KEY }}
          PHIO_DEPLOY_KEY_PUB: ${{ secrets.PHIO_DEPLOY_KEY_PUB }}
      - run: phio deploy -v
        env:
          PHIO_USERNAME: ${{ secrets.PHIO_USERNAME }}
          PHIO_PASSWORD: ${{ secrets.PHIO_PASSWORD }}
      - name: Power cycle the instance
        # phio only syncs files; the instance restarts itself when pb_hooks
        # change, racing the sync, so it can boot a mix of old and new hooks.
        # Hooks and migrations register at boot, so restart it once the sync
        # is complete. The PocketHost dashboard's power toggle is
        # PUT /api/instance/{id} on the mothership (a PocketBase app),
        # authenticated with the same account phio uses. The UA header
        # matters: the mothership sits behind Cloudflare rules that reject
        # non-browser agents. Mirrors patsissons/cubby's deploy workflow.
        env:
          PHIO_USERNAME: ${{ secrets.PHIO_USERNAME }}
          PHIO_PASSWORD: ${{ secrets.PHIO_PASSWORD }}
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const BASE = 'https://pockethost-central.pockethost.io'
          const HEADERS = {
            'User-Agent': 'Mozilla/5.0 (compatible; daythatworks-deploy)',
            'Content-Type': 'application/json',
          }
          const die = (msg) => {
            console.error(`::error::${msg}`)
            process.exit(1)
          }
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
          const main = async () => {
            let res = await fetch(`${BASE}/api/collections/users/auth-with-password`, {
              method: 'POST',
              headers: HEADERS,
              body: JSON.stringify({
                identity: process.env.PHIO_USERNAME,
                password: process.env.PHIO_PASSWORD,
              }),
            })
            if (!res.ok) die(`mothership login failed (${res.status})`)
            const { token } = await res.json()
            const auth = { ...HEADERS, Authorization: token }

            // the same instance phio deploys to
            const name = JSON.parse(fs.readFileSync('.phioconfig', 'utf8')).instanceName
            const filter = encodeURIComponent(`subdomain='${name}' || cname='${name}'`)
            res = await fetch(`${BASE}/api/collections/instances/records?filter=${filter}`, { headers: auth })
            if (!res.ok) die(`instance lookup failed (${res.status})`)
            const { items } = await res.json()
            if (!items.length) die(`no instance named "${name}" on this account`)
            const id = items[0].id

            const power = async (on) => {
              const r = await fetch(`${BASE}/api/instance/${id}`, {
                method: 'PUT',
                headers: auth,
                body: JSON.stringify({ id, fields: { power: on } }),
              })
              if (!r.ok) die(`power ${on ? 'on' : 'off'} failed (${r.status})`)
              console.log(`power ${on ? 'on' : 'off'} ok`)
            }
            await power(false)
            await sleep(5000)
            await power(true)

            // wake it and confirm it serves before calling the deploy done
            const url = `https://${name}.pockethost.io`
            for (let attempt = 1; attempt <= 12; attempt++) {
              await sleep(5000)
              try {
                const ping = await fetch(`${url}/api/health`, { headers: HEADERS })
                console.log(`health check ${attempt}: ${ping.status}`)
                if (ping.ok) return
              } catch (err) {
                console.log(`health check ${attempt}: ${err.message}`)
              }
            }
            die('instance did not come back after power cycle')
          }
          main()
          EOF
